<div className="grid md:grid-cols-3 gap-4">${[['📡',t.s1,t.s1d],['📸',t.s2,t.s2d],['🍳',t.s3,t.s3d]].map(([e,a,b],i)=>h`<div key=${i} className="rounded-2xl bg-white/10 border border-white/10 p-6"><div className="text-3xl mb-3">e</div><divclassName="font-semiboldmb-1">{a}</div><div className="text-sm text-emerald-100/70">${b}</div></div>`)}</div></div></div>`;

h`<div className="space-y-4">${Card(h`<div className="flex items-center justify-between flex-wrap gap-2 mb-4"><div className="font-semibold">${t.list}</div>${Btn('👪 '+t.share+(pro?'':' 🔒'),()=>pro?setShared(!shared):(say('🔒 '+t.proOnly),setPg(5)),'bg-slate-800 hover:bg-slate-900 text-white')}</div>
